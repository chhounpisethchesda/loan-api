services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: loan-api-prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://loanuser:loanpassword@db:5432/loandb
      - MODEL_PATH=/app/models/model.joblib
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: loan-db
    environment:
      POSTGRES_USER: loanuser
      POSTGRES_PASSWORD: loanpassword
      POSTGRES_DB: loandb
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanuser -d loandb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
